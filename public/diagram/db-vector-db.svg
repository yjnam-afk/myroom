  <path class="red" d="M685,160 L685,205 L90,205 L90,162"/>
  <text class="tag" x="390" y="198">쿼리 벡터(질문도 같은 임베딩 공간으로)</text>
  <text class="note" x="400" y="40">〈 벡터 DB — 임베딩을 색인해 근사 최근접(ANN)으로 유사 검색 〉</text>

</svg>
