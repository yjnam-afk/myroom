<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 470" font-family="Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif">
  <rect width="1210" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b71c1c"/>
    </marker>
  </defs>

  <!-- Upstream (Pretrain) -->
  <rect x="20" y="24" width="1040" height="150" rx="26" fill="none" stroke="#8a8a8a" stroke-width="3"/>
  <g font-size="30" font-weight="700" fill="#8a8a8a" text-anchor="middle">
    <rect x="60" y="62" width="180" height="74" fill="none" stroke="#8a8a8a" stroke-width="7"/>
    <text x="150" y="110">Data1</text>
    <rect x="400" y="62" width="180" height="74" fill="none" stroke="#8a8a8a" stroke-width="7"/>
    <text x="490" y="110">Model</text>
    <rect x="700" y="62" width="170" height="74" fill="none" stroke="#8a8a8a" stroke-width="7"/>
    <text x="785" y="110">Task1</text>
  </g>
  <g stroke="#9a9a9a" stroke-width="2.5" marker-end="url(#arrG)">
    <line x1="240" y1="99" x2="394" y2="99"/>
    <line x1="580" y1="99" x2="694" y2="99"/>
  </g>
  <text x="930" y="108" font-size="23" fill="#222">Pretrain</text>
  <text x="1078" y="90" font-size="28" font-weight="800" fill="#111">Up</text>
  <text x="1078" y="126" font-size="28" font-weight="800" fill="#111">Stream</text>

  <!-- Knowledge Transfer -->
  <line x1="490" y1="136" x2="490" y2="288" stroke="#b71c1c" stroke-width="7" marker-end="url(#arrR)"/>
  <text x="520" y="225" font-size="34" font-weight="800" fill="#b71c1c">Knowledge Transfer</text>

  <!-- Downstream (Finetuning) -->
  <rect x="20" y="296" width="1040" height="150" rx="26" fill="none" stroke="#8a8a8a" stroke-width="3"/>
  <g font-size="30" font-weight="700" fill="#8a8a8a" text-anchor="middle">
    <rect x="60" y="334" width="180" height="74" fill="none" stroke="#8a8a8a" stroke-width="7"/>
    <text x="150" y="382">Data2</text>
    <rect x="400" y="334" width="180" height="74" fill="none" stroke="#8a8a8a" stroke-width="7"/>
    <text x="490" y="382">Model</text>
    <rect x="700" y="334" width="170" height="74" fill="none" stroke="#8a8a8a" stroke-width="7"/>
    <text x="785" y="382">Task2</text>
  </g>
  <g stroke="#9a9a9a" stroke-width="2.5" marker-end="url(#arrG)">
    <line x1="240" y1="371" x2="394" y2="371"/>
    <line x1="580" y1="371" x2="694" y2="371"/>
  </g>
  <text x="905" y="380" font-size="23" fill="#222">Finetuning</text>
  <text x="1078" y="362" font-size="28" font-weight="800" fill="#111">Down</text>
  <text x="1078" y="398" font-size="28" font-weight="800" fill="#111">Stream</text>
</svg>
