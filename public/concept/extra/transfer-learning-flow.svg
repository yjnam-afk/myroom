<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 520" font-family="Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif">
  <rect width="1024" height="520" fill="#ffffff"/>
  <text x="512" y="46" text-anchor="middle" font-size="30" font-weight="800" fill="#c62828">Transfer Learning</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Task 1 -->
  <text x="500" y="96" text-anchor="middle" font-size="21" font-weight="800" fill="#c62828">Task 1</text>
  <rect x="345" y="108" width="315" height="96" rx="16" fill="none" stroke="#777" stroke-width="2"/>
  <g font-size="16" font-weight="600" fill="#1a1a1a" text-anchor="middle">
    <rect x="165" y="132" width="110" height="48" rx="8" fill="#f9a13a" stroke="#c87413"/>
    <text x="220" y="161">Data1</text>
    <rect x="370" y="132" width="110" height="48" rx="8" fill="#f9a13a" stroke="#c87413"/>
    <text x="425" y="161">Model1</text>
    <rect x="525" y="132" width="110" height="48" rx="8" fill="#f9a13a" stroke="#c87413"/>
    <text x="580" y="161">Head</text>
    <rect x="720" y="132" width="140" height="48" rx="8" fill="#f9a13a" stroke="#c87413"/>
    <text x="790" y="161">Predictions1</text>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#arr)">
    <line x1="275" y1="156" x2="366" y2="156"/>
    <line x1="480" y1="156" x2="521" y2="156"/>
    <line x1="635" y1="156" x2="716" y2="156"/>
  </g>

  <!-- Knowledge transfer -->
  <line x1="425" y1="180" x2="425" y2="342" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="300" y="268" text-anchor="middle" font-size="17" font-weight="800" fill="#7a2020">Knowledge transfer</text>

  <!-- Task 2 -->
  <text x="500" y="300" text-anchor="middle" font-size="21" font-weight="800" fill="#c62828">Task 2</text>
  <rect x="345" y="312" width="315" height="96" rx="16" fill="none" stroke="#777" stroke-width="2"/>
  <g font-size="16" font-weight="600" fill="#1a1a1a" text-anchor="middle">
    <rect x="165" y="336" width="110" height="48" rx="8" fill="#f9a13a" stroke="#c87413"/>
    <text x="220" y="365">Data2</text>
    <rect x="370" y="336" width="110" height="48" rx="8" fill="#f9a13a" stroke="#c87413"/>
    <text x="425" y="365">Model1</text>
    <rect x="525" y="336" width="110" height="48" rx="8" fill="#f9a13a" stroke="#c87413"/>
    <text x="580" y="358">New</text>
    <text x="580" y="376">Head</text>
    <rect x="720" y="336" width="140" height="48" rx="8" fill="#f9a13a" stroke="#c87413"/>
    <text x="790" y="365">Predictions2</text>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#arr)">
    <line x1="275" y1="360" x2="366" y2="360"/>
    <line x1="480" y1="360" x2="521" y2="360"/>
    <line x1="635" y1="360" x2="716" y2="360"/>
  </g>

  <!-- 읽는 법 — 답안 전개용 한 줄 -->
  <text x="512" y="472" text-anchor="middle" font-size="15" fill="#555">Task 1에서 학습한 Model1(특징 추출부)을 그대로 옮기고, Head만 새로 달아 Task 2를 적은 데이터로 학습</text>
</svg>
