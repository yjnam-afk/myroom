<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 300" font-family="Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif">
  <!-- 자기지도학습 교재 개념도 — Unlabeled Dataset → Pre-text Task ⇒ Knowledge Transfer ⇒ Labeled Dataset → Downstream Task -->
  <rect width="1210" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <g font-size="26" font-weight="700" fill="#111" text-anchor="middle">
    <rect x="30" y="70" width="230" height="110" fill="none" stroke="#222" stroke-width="4"/>
    <text x="145" y="118">Unlabeled</text>
    <text x="145" y="154">Dataset</text>

    <rect x="330" y="70" width="200" height="110" fill="none" stroke="#222" stroke-width="4"/>
    <text x="430" y="118">Pre-text</text>
    <text x="430" y="154">Task</text>

    <rect x="700" y="70" width="220" height="110" fill="none" stroke="#222" stroke-width="4"/>
    <text x="810" y="118">Labeled</text>
    <text x="810" y="154">Dataset</text>

    <rect x="980" y="70" width="210" height="110" fill="none" stroke="#222" stroke-width="4"/>
    <text x="1085" y="118">Downstream</text>
    <text x="1085" y="154">Task</text>
  </g>

  <g stroke="#222" stroke-width="3.5" marker-end="url(#arr)">
    <line x1="260" y1="125" x2="324" y2="125"/>
    <line x1="920" y1="125" x2="974" y2="125"/>
  </g>
  <!-- Knowledge Transfer: 굵은 이중선 화살표 -->
  <line x1="530" y1="125" x2="694" y2="125" stroke="#222" stroke-width="10" marker-end="url(#arr)"/>
  <line x1="530" y1="125" x2="680" y2="125" stroke="#ffffff" stroke-width="4"/>
  <text x="612" y="60" font-size="24" font-weight="700" fill="#111" text-anchor="middle">Knowledge</text>
  <text x="612" y="90" font-size="24" font-weight="700" fill="#111" text-anchor="middle">Transfer</text>

  <!-- 아래 구간 표시 -->
  <g stroke="#222" stroke-width="3">
    <line x1="30" y1="215" x2="530" y2="215"/>
    <line x1="30" y1="205" x2="30" y2="225"/>
    <line x1="530" y1="205" x2="530" y2="225"/>
    <line x1="700" y1="215" x2="1190" y2="215"/>
    <line x1="700" y1="205" x2="700" y2="225"/>
    <line x1="1190" y1="205" x2="1190" y2="225"/>
  </g>
  <g font-size="26" font-weight="700" fill="#111" text-anchor="middle">
    <text x="280" y="262">Self-supervised</text>
    <text x="945" y="262">Supervised</text>
  </g>
</svg>
